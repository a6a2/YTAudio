name: Play Protect diagnosis
# Manual only. Builds 4 progressively stripped-down test APKs (signed with the real key) so you can find out which
# feature makes Google Play Protect warn. See tools/diag_variants.py. Never attaches anything to a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. Test APKs must use the same key as your releases."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ytaudio.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ytaudio.keystore" >> "$GITHUB_ENV"

      - name: Build the four variants
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          mkdir out
          for n in 1 2 3 4; do
            python3 tools/diag_variants.py "$n"
            ./gradlew assembleRelease --no-daemon
            mv app/build/outputs/apk/release/app-release.apk "out/YTAudio-diag$n.apk"
          done
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: playprotect-diagnosis-apks
          path: out/
