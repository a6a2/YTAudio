name: Build APK
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  release: { types: [published] }

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      signed: ${{ steps.meta.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew   # files uploaded via the GitHub web page lose the executable bit
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Prepare signing key (only when secrets exist; never for fork PRs)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ytaudio.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/ytaudio.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets: APK will be signed with a throwaway debug key (fine for testing, cannot update a real install)."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        id: meta
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          SUFFIX=""; [ "$SIGNED" = "true" ] || SUFFIX="-UNSIGNED-TEST"
          mv app/build/outputs/apk/release/app-release.apk "YTAudio-v${VERSION}${SUFFIX}.apk"
          sha256sum YTAudio-v*.apk | tee SHA256SUMS.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: YTAudio-v${{ steps.meta.outputs.version }}-run${{ github.run_number }}
          path: |
            YTAudio-v*.apk
            SHA256SUMS.txt

      - name: Lint report (informational)
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  release:
    # Only publishes APKs that were signed with the real key.
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Refuse to publish an unsigned/test build
        if: needs.build.outputs.signed != 'true'
        run: echo "::error::Signing secrets are missing; not attaching a test-signed APK to the release." && exit 1
      - uses: actions/download-artifact@v4
        with:
          name: YTAudio-v${{ needs.build.outputs.version }}-run${{ github.run_number }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            YTAudio-v*.apk
            SHA256SUMS.txt
